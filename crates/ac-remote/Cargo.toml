[package]
name = "ac-remote"
description = "Remote access to PCs on the local network: pairing, transport and protocol (from RemoteLinux)"
version.workspace = true
# Ported from RemoteLinux as is; kept on its edition.
edition = "2021"
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
tokio = { workspace = true, features = ["signal"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rcgen = "0.14"
serde.workspace = true
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
toml.workspace = true
tracing.workspace = true
sha2.workspace = true
hex = "0.4"
spake2 = "0.4"
hmac = "0.12"
rand = "0.8"
bytes = "1"
mdns-sd = "0.21.5"
iroh = { version = "1.4", default-features = false, features = ["tls-ring", "portmapper"] }
opus = "0.3"

[target.'cfg(windows)'.dependencies]
cpal = "0.18"
